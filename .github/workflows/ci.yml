name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly canary against Constellation main (job `test-latest`), so upstream
  # drift surfaces even while protostar itself is quiet.
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Constellation commit that protostar is tested against on push/PR. Bump it
  # deliberately (in its own commit) after checking the canary job / changelog:
  #   git -C ../constellation rev-parse origin/main
  CONSTELLATION_REF: 77f540f23f271f9a67405466ba99220559bdbea0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.9"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Test (py3.12, pinned constellation)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # protostar's only dependency, constellation-bio, is not on PyPI — it is
      # installed from the (public) lab repo at the pinned CONSTELLATION_REF.
      - name: Install constellation (pinned) + protostar
        run: |
          python -m pip install --upgrade pip
          pip install "constellation-bio[ms] @ git+https://github.com/wilburnlab/constellation.git@${CONSTELLATION_REF}"
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  test-latest:
    name: Canary (py3.12, constellation main)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install constellation (main) + protostar
        run: |
          python -m pip install --upgrade pip
          pip install "constellation-bio[ms] @ git+https://github.com/wilburnlab/constellation.git@main"
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest
